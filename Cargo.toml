[package]
name = "rusty-ranger-fast"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
anyhow = "1.0"
serde_json = "1.0"
image = "0.25"
calamine = "0.24"
zip = { version = "0.6", default-features = false, features = ["deflate", "time"] }
dirs = "5.0"
chrono = "0.4"
once_cell = "1.19"
parking_lot = "0.12"
viuer = "0.7"
pdf-extract = "0.7"
lopdf = "0.34"
csv = "1.3"
lofty = "0.21"
sha2 = "0.10"
hex = "0.4"
unicode-normalization = "0.1"
unicode-segmentation = "1.12"
unicode-width = "0.1"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Console", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_HiDpi", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
# ueberzugpp overlay is Unix-only — no extra crates needed, handled via process::Command

[profile.dev]
debug = 0
strip = true
